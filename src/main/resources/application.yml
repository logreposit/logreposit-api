app:
  modes:
    enabled: INGRESS, PROCESSOR_MQTT, PROCESSOR_INFLUX

messaging:
  retry:
    message-sender-retry-count: 5
    message-sender-retry-initial-back-off-interval: 1100
    message-sender-back-off-multiplier: 1.5
    message-retry-intervals: 10000,30000,300000
    application-modes:
      enabled: [ingress, processor_mqtt, processor_influx]

mqtt:
  enabled: false
  host: 127.0.0.1
  port: 1883
  username: administrator
  password: administrator1
  emqx:
    managementEndpoint: http://127.0.0.1:18083

influxdbservice:
  communication:
    messaging:
      rabbit:
        queue: q.influxdb_service
    influx:
      url: http://localhost:8086
      username: admin
      password: admin

logging:
  pattern:
    console: "%clr(%d{\"yyyy-MM-dd'T'HH:mm:ss,SSSXXX\", UTC}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(${PID: }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{correlationId:-}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}"
    file: "%d{\"yyyy-MM-dd'T'HH:mm:ss,SSSXXX\", UTC} ${LOG_LEVEL_PATTERN:%5p} ${PID: } --- [%t] [%X{correlationId:-}] %-40.40logger{39} : %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}"
  file:
    name: logs/logreposit-api.log

server:
    port: "${port:8080}"

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
  data:
    mongodb:
      host: localhost
      port: 27017
      database: logrepositapi
  mvc:
    # TODO DoM: maybe remove this, seems to be deprecated
    #throw-exception-if-no-handler-found: true
    static-path-pattern: /reference/**
  web:
    resources:
      # add-mappings: false
      static-locations:
        - 'classpath:/static/'

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  prometheus:
    metrics:
      export:
        descriptions: false
