<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="1" y="1" width="14" height="14" rx="2" ry="2"
        fill="#0a0a0a" stroke="#00ff41" stroke-width="1"/>

  <!-- Minimal circuit grid -->
  <g stroke="#00ff41" stroke-width="0.5" fill="none" opacity="0.3">
    <line x1="3" y1="5" x2="13" y2="5"/>
    <line x1="3" y1="8" x2="13" y2="8"/>
    <line x1="3" y1="11" x2="13" y2="11"/>
    <line x1="5" y1="3" x2="5" y2="13"/>
    <line x1="8" y1="3" x2="8" y2="13"/>
    <line x1="11" y1="3" x2="11" y2="13"/>
  </g>

  <!-- CPU chip -->
  <rect x="6" y="6" width="4" height="4" rx="0.5" ry="0.5"
        fill="#1a1a1a" stroke="#00ff41" stroke-width="0.5"/>

  <!-- Bold "L" for maximum clarity at 16px -->
  <g fill="#00ff41">
    <rect x="7" y="7" width="1" height="2.5"/>
    <rect x="7" y="8.5" width="2" height="1"/>
  </g>
</svg>